<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Capture your thoughts</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Capture your thoughts, keep life moving.</p>
    </div>
  </header>

  <main class="container">
    <section class="section-card" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-field">
          <label for="note-input">Your note</label>
          <input
            id="note-input"
            name="note"
            type="text"
            maxlength="201"
            placeholder="What would you like to remember?"
            autocomplete="off"
            required
          >
        </div>
        <div class="form-field">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <section class="section-card" aria-labelledby="your-notes-heading">
      <div class="notes-heading">
        <h2 id="your-notes-heading">Your notes</h2>
        <button id="clear-all" class="secondary-button" type="button">Clear all</button>
      </div>
      <label class="visually-hidden" for="search-input">Search notes</label>
      <input
        id="search-input"
        type="search"
        placeholder="Search your notes..."
        autocomplete="off"
      >
      <p id="note-count" aria-live="polite">You have no notes yet.</p>
      <ul id="notes-list" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>QuickNotes &mdash; a little space for your thoughts.</p>
    </div>
  </footer>
</body>
</html>
